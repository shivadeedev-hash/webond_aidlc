      <stop offset="0" stop-color="#d61f2c"/>
      <stop offset="1" stop-color="#96101a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#g)"/>
  <path d="M7 21l5.3-9.3 4.7 6.6 3.3-4.6L25 21" fill="none" stroke="#fff" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
