# WeBond SPA: static files with client-side routing fallback.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Baseline security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build files never change: cache them for a year. Only paths that end
    # in a file extension are build files: the app itself has routes under
    # /assets/ too (/assets/bond/1), which must fall through to index.html.
    location ~* ^/assets/.+\.[a-z0-9]+$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new releases are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # React Router: any other path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
