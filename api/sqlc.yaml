version: "2"
sql:
  - engine: "mysql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        # Money/unit columns are DECIMAL(18,4): map to shopspring/decimal, never
        # float (NFR-05, data-model.md). NULLable decimals use decimal.NullDecimal.
        overrides:
          - db_type: "decimal"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "decimal"
            nullable: true
            go_type: "github.com/shopspring/decimal.NullDecimal"
          # MySQL bare TIME columns (e.g. funds.cutoff_time) are returned by the
          # driver as []byte even with parseTime=true; map them to string so
          # reads scan cleanly (value like "15:30:00").
          - db_type: "time"
            go_type: "string"
